# 한국어 내레이터가 잘못 읽을 수 있는 말의 읽는 법. TTS 요청 직전에 소리용 문장에만 적용하고, 자막은 쓴 그대로 둔다.
# 받아쓰기에서 잘못 읽은 말이 나오면 여기에 더한다. 읽는 법은 원래 말과 받침이 같아야 한다(Fed→연준은 "연준는"이 된다).
ECB: 이시비
IMF: 아이엠에프
BIS: 비아이에스
OECD: 오이시디
GDP: 지디피
FOMC: 에프오엠시
PCE: 피시이
CDS: 시디에스
TPI: 티피아이
OMT: 오엠티
VIX: 빅스
KOSPI: 코스피
bp: 베이시스포인트
"%p": 퍼센트포인트
"%": 퍼센트
