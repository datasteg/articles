# The podcast video: a published article as NotebookLM's two-host conversation with the article's slides cut to it
# (guides/video-podcast.md, config/video/podcast.yaml). The editor's choice of 29 Oct 2026 over the solo narrator
# (config/video/pipeline.yaml). `artools video auto <slug>` makes this run when podcast.yaml → default_mode is podcast.
id: video-podcast
version: "1.0"
status: live
private: true
name: {en: Podcast video, ko: 팟캐스트 영상}
tagline: {en: "A published article as a two-host conversation with summary slides, in English and Korean", ko: "게시된 기사를 두 진행자의 대화와 요약 슬라이드로, 영어와 한국어로"}
shape: {minutes: "10–25", slides: "20–45", gates: 0}
guide: guides/video-podcast.md
phases:
  - {id: audio, label: {en: Audio, ko: 음성}}
  - {id: slides, label: {en: Slides, ko: 슬라이드}}
  - {id: review, label: {en: Review, ko: 검토}}
  - {id: publish, label: {en: Publish, ko: 게시}}
steps:
  - id: podcast
    skill: make-podcast
    chrome: true
    phase: audio
    label: {en: NotebookLM audio, ko: NotebookLM 음성}
    detail: {en: "The source and focus prompt, then an Audio Overview per edition in NotebookLM, downloaded", ko: "자료와 초점 지시문을 만들고, 언어판마다 NotebookLM 오디오 개요를 만들어 내려받는다"}
  - id: transcribe
    command: transcribe
    phase: audio
    label: {en: Transcript, ko: 받아쓰기}
    detail: {en: "VibeVoice-ASR transcribes each audio on this machine, in timed segments", ko: "VibeVoice-ASR이 이 컴퓨터에서 음성을 시간이 붙은 구간으로 받아쓴다"}
  - id: slides
    skill: make-podcast-slides
    phase: slides
    label: {en: Slides cut to the audio, ko: 음성에 맞춘 슬라이드}
    detail: {en: "The article's components and story line, animated and timed to what the hosts say; captions translated", ko: "기사의 구성 요소와 이야기 흐름을 진행자의 말에 맞춰 움직이게 하고, 자막을 번역한다"}
  - id: assemble
    command: assemble-podcast
    phase: slides
    label: {en: Assemble, ko: 합치기}
    detail: {en: "Video with cross-fades and the story rail, loudness, captions in both languages, chapters, thumbnail", ko: "장면 전환과 이야기 막대를 넣은 영상, 음량, 두 언어 자막, 챕터, 썸네일"}
  - id: review
    skill: review-podcast
    phase: review
    loop: {owners: [make-podcast, make-podcast-slides], max: 2}
    label: {en: Review, ko: 검토}
    detail: {en: "What the hosts say checked against the article; the slides checked against the hosts", ko: "진행자의 말을 기사와, 슬라이드를 진행자의 말과 대조한다"}
  - id: upload
    command: upload
    phase: publish
    label: {en: Publish on YouTube, ko: YouTube에 공개}
    detail: {en: "Both editions public, with captions in both languages, playlists and links to each other", ko: "두 언어판을 공개로 올리고 두 언어 자막, 재생목록, 서로의 링크를 붙인다"}
  - id: finish
    command: finish
    phase: publish
    label: {en: Thumbnails and links, ko: 썸네일과 링크}
    detail: {en: "Waits for YouTube's processing, then sets both thumbnails and links the editions to each other", ko: "YouTube 처리가 끝나기를 기다려 썸네일을 붙이고 두 언어판을 서로 잇는다"}
  - id: clean
    command: clean
    phase: publish
    label: {en: Free the disk, ko: 디스크 비우기}
    detail: {en: "Audio, frames, clips and video deleted: they live in NotebookLM and on YouTube", ko: "음성, 프레임, 클립, 영상을 지운다. NotebookLM과 YouTube에 남는다"}
  - id: publish
    skill: publish-video
    manual: true
    phase: publish
    label: {en: Check and report, ko: 확인과 보고}
    detail: {en: "The editor watches the public videos; corrections follow D13", ko: "편집자가 공개 영상을 확인하고, 정정은 D13을 따른다"}
