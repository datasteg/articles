[project]
name = "artools"
version = "0.1.0"
description = "datasteg articles: the newsroom's deterministic tools (runs, sources, checks, preview, publish, driver)"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pandas>=2.2",
    "jsonschema>=4.23",
    "pyyaml>=6.0",
    "playwright==1.62.0",
    # the video explainer (config/video/): Gemini TTS, YouTube upload, a bundled ffmpeg
    "google-genai==2.29.0",
    "google-api-python-client==2.201.0",
    "google-auth-oauthlib==1.5.0",
    "imageio-ffmpeg==0.6.0",
]

[project.scripts]
artools = "artools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["artools"]

[dependency-groups]
dev = ["pytest>=8"]
