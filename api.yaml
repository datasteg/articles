# The articles app's views for the datasteg API and MCP server (whole
# articles are readable, with the terms and the citation in every answer). Route handlers: apps/web/app/svc/v1/,
# built from apps/web/lib/svc-articles.ts over the published content index (lib/content.ts).
id: articles
title: articles
summary: Explainers on economics and finance from central-bank research and official statistics, in English and Korean, with their numbered facts, chart data, sources and glossary.
site: https://articles.datasteg.com
internal: http://articles:8080
status: live
surface: "1.0"
hooks: [search, item, economy]
item_kinds: [article, term]
search_example: korea
item_example: "article:won-after-rate-hold"
terms: https://articles.datasteg.com/en/terms
views:
  - id: articles
    path: /articles
    summary: The published articles, newest first, by topic, country or type.
    params:
      topic: { type: string, pattern: "^[a-z0-9-]{1,60}$", description: "A topic id such as exchange-rates or monetary-policy (the topics view lists them)" }
      country: { type: string, pattern: "^[A-Za-z0-9]{2,4}$", description: "An economy the article covers: ISO 3166-1 alpha-2 (KR) or alpha-3 (KOR); EA or EMU for the euro area, EU for the European Union" }
      type: { type: string, enum: [explainer, deep-dive, data-brief, data-note, paper-digest, speech-roundup], description: "The article type" }
      limit: { type: integer, minimum: 1, maximum: 100, default: 25, description: "How many articles to return" }
      cursor: { type: string, maxLength: 12, description: "The cursor a previous answer returned, for the next page" }
    table: true
    max_bytes: 60000
    example: { country: KR }
    tool:
      name: articles_list
      title: Articles by topic, country or type
      description: >-
        Articles by topic, country or type, newest first. Lists datasteg's published explainers on economics and
        finance (English and Korean) with title, kicker, dek, type, date, topics, countries and the page link. Use it
        to find articles about an economy, a market or a policy before reading one or asking for its numbers.

  - id: article
    path: /articles/{slug}
    summary: One article for reading in the asked edition, with its sources, terms and citation.
    params:
      slug: { in: path, type: string, pattern: "^[a-z0-9][a-z0-9-]{0,99}$", description: "The article's slug, such as won-after-rate-hold" }
      section: { type: string, pattern: "^[a-z0-9-]{1,60}$", description: "One section id, to read only that section (the whole article when left out)" }
    table: false
    max_bytes: 120000
    example: { slug: won-after-rate-hold }

  - id: facts
    path: /articles/{slug}/facts
    summary: An article's numbered facts with unit, period and source, and with chart= that chart's data and metadata.
    params:
      slug: { in: path, type: string, pattern: "^[a-z0-9][a-z0-9-]{0,99}$", description: "The article's slug, such as won-after-rate-hold" }
      chart: { type: string, pattern: "^[a-z0-9-]{1,60}$", description: "A chart id of the article (its charts are listed in the article view), to add that chart's data and metadata" }
      limit: { type: integer, minimum: 1, maximum: 100, default: 25, description: "How many facts to return" }
      cursor: { type: string, maxLength: 12, description: "The cursor a previous answer returned, for the next facts" }
    table: true
    max_bytes: 100000
    example: { slug: won-after-rate-hold, chart: decision-days }
    tool:
      name: article_numbers
      title: An article's numbers and chart data
      description: >-
        An article's numbered facts and chart data, each with unit, period and source. Returns the facts behind the
        article's text (unrounded values, with the sources each was computed from; numbers the pipeline blocked are
        never listed) and, with chart=<id>, that chart's rows, as in its CSV, with provider, series keys, definition,
        span and licence.

  - id: chart
    path: /articles/{slug}/charts/{chart}
    summary: One chart's data as a table (the rows of the CSV the page offers) with its metadata.
    params:
      slug: { in: path, type: string, pattern: "^[a-z0-9][a-z0-9-]{0,99}$", description: "The article's slug, such as won-after-rate-hold" }
      chart: { in: path, type: string, pattern: "^[a-z0-9-]{1,60}$", description: "The chart id, such as won-2026" }
    table: true
    max_bytes: 100000
    example: { slug: won-after-rate-hold, chart: won-2026 }

  - id: glossary
    path: /glossary
    summary: The glossary's terms in plain words, each with its definition, topics and the articles that use it.
    params:
      topic: { type: string, pattern: "^[a-z0-9-]{1,60}$", description: "Only the terms of one topic" }
      article: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,99}$", description: "Only the terms one article uses (its slug)" }
    table: true
    max_bytes: 80000
    example: {}

  - id: topics
    path: /topics
    summary: The topics in their groups, each with its articles and glossary terms.
    params: {}
    table: true
    max_bytes: 20000
    example: {}
